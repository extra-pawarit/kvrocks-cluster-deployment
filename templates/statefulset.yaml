apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kvrocks-cluster.fullname" . }}
  labels:
    {{- include "kvrocks-cluster.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kvrocks-cluster.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kvrocks-cluster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "kvrocks-cluster.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: kvrocks
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: KVR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ if .Values.auth.useExistingSecret }}{{ .Values.auth.existingSecret }}{{ else }}{{ include "kvrocks-cluster.fullname" . }}-password{{ end }}
              key: {{ .Values.auth.secretKey }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /var/run/kvrocks-config
        - name: data
          mountPath: /var/lib/kvrocks
        - name: init-script
          mountPath: /var/run/kvrocks-init-script
        command: ["/bin/sh"]
        args:
          - "-c"
          - |
            cp /var/run/kvrocks-config/kvrocks.conf /var/lib/kvrocks/kvrocks.conf
            sed -i "s/__KVR_PASSWORD__/${KVR_PASSWORD}/g" /var/lib/kvrocks/kvrocks.conf
            exec kvrocks -c /var/lib/kvrocks/kvrocks.conf
      volumes:
      - name: config
        configMap:
          name: {{ include "kvrocks-cluster.fullname" . }}-config
      - name: init-script
        configMap:
          name: {{ include "kvrocks-cluster.fullname" . }}-init-script
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.storage.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.storage.size }}
