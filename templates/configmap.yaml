apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kvrocks-cluster.fullname" . }}-config
data:
  kvrocks.conf: |
    bind 0.0.0.0
    port 6379
    cluster-enabled yes
    requirepass {{ .Values.password }}
    masterauth {{ .Values.password }}
    dir /var/lib/kvrocks
    rocksdb.write_buffer_size 64
    rocksdb.max_write_buffer_number 4
    rocksdb.target_file_size_base 64
    rocksdb.max_background_compactions 2
    rocksdb.max_background_flushes 1
